<!DOCTYPE html>
<html>
<head>
    <title>Something Special</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 80%;
            margin: 20px;
        }
        h1 {
            color: #ff4d4d;
            margin-bottom: 30px;
        }
        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #ff4d4d;
        }
        #message {
            padding: 15px;
            border: 2px solid #ffb3b3;
            border-radius: 10px;
            min-height: 50px;
            width: 80%;
            margin: 0 auto;
            font-size: 16px;
            background-color: #fff9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Here is Something for You <3</h1>
        <button onclick="showMessage()">Press Me</button>
        <div id="message"></div>
    </div>

    <script>
        const messages = [
            "You are incredible.",
            "I feel so protected around you.",
            "Thank you for putting up with me.",
            "I could just cuddle you all night long.",
            "My friends are so jealous I have you.",
            "I just can't imagine walking through life without you.",
            "I just love what a cute smile you have.",
            "I appreciate you for working so hard.",
            "I have the best boyfriend and life partner.",
            "Thanks for loving such an awkward, inverted mess.",
            "Tea, coffee, or me?",
            "I can't get my bra off. Can you come over and give me a hand?",
            "Take your clothes off. Lie down. Shut up.",
            "Show me where you want me to bite you.",
            "I love the way you taste.",
            "You know you bitch.",
            "You know you cow.",
            "Can I fuck you. ;)",
            "I so wanna bite you.",
            "I love you baby"
        ];

        let remainingMessages = [...messages];

        function showMessage() {
            if (remainingMessages.length === 0) {
                // All messages have been shown, reset the array
                remainingMessages = [...messages];
            }
            
            // Get random index from remaining messages
            const randomIndex = Math.floor(Math.random() * remainingMessages.length);
            
            // Get the message and remove it from remaining messages
            const message = remainingMessages[randomIndex];
            remainingMessages.splice(randomIndex, 1);
            
            // Display the message
            document.getElementById('message').textContent = message;
        }
    </script>
</body>
</html>
